    display:flex; align-items:center; justify-content:center;
    transition: opacity .5s ease, visibility .5s;
  }
  #splash h1{
    font-family:'Playfair Display', serif;
    font-weight:700; font-size:26px; color:var(--white);
    margin:0; letter-spacing:.01em;
    animation: rise .7s ease both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  #splash.hide{ opacity:0; visibility:hidden; }

  /* ---------- Home ---------- */
  #home{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding: 22px 22px calc(18px + env(safe-area-inset-bottom));
    overflow:hidden;
  }
  .deck{
    min-height: 0;   /* lets the deck shrink instead of pushing the button off-screen */
  }
  .card{
    max-height: 100%;
  }
  .meal-line{
    font-size:13px; color:var(--ink-soft); margin:0 0 2px;
  }
  .head{
    font-family:'Playfair Display', serif;
    font-size:22px; font-weight:600; margin:0;
  }

  /* ---------- Card deck ---------- */
  .deck{
    flex:1;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    margin-top: 8px;
  }
  .card{
    position:absolute;
    width: 250px; height: 330px;
    border-radius: var(--card-radius);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:26px;
    will-change: transform, opacity;
  }
  .card.back{
    will-change: transform;
    background-color: var(--orange);
    background-image: var(--pattern);
    background-size: cover;
    background-position: center;
    box-shadow: 0 8px 22px rgba(46,32,19,.14);
  }
  .card.front{
    background: var(--white);
    border: 1.5px solid var(--orange);
    box-shadow: 0 10px 26px rgba(46,32,19,.16);
    cursor: grab;
    touch-action: none;
    z-index: 5;
  }
  .card.front:active{ cursor:grabbing; }
  .card.front .dish{
    font-family:'Playfair Display', serif;
    font-weight:700; font-size:21px; line-height:1.35;
    margin:0;
  }
  .card.front .kind{
    position:absolute; top:20px; left:0; right:0;
    font-size:11.5px; color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .card.front .sub{
    position:absolute; bottom:22px; left:22px; right:22px;
    font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.5;
  }
  .card.front.resto .dish{ color: var(--orange-deep); }

  .hint{
    text-align:center; font-size:12.5px; color:var(--ink-soft);
    margin: 0 0 10px; opacity:.85;
    transition: opacity .25s;
  }

  /* ---------- Confirm button ---------- */
  .confirm-btn{
    width:100%; height:52px;
    border:none; border-radius:14px;
    background: var(--orange); color: var(--white);
    font-family:'Work Sans', sans-serif;
    font-weight:600; font-size:15px;
    cursor:pointer;
    transition: transform .15s ease, background .2s ease, opacity .2s;
  }
  .confirm-btn:active{ transform: scale(.985); }
  .confirm-btn[disabled]{
    background: #F4EDE4; color: var(--ink-soft);
    cursor: default;
  }

  /* ---------- Locked card ---------- */
  .card.front.locked{
    border-width: 2.5px;
    box-shadow: 0 12px 30px rgba(247,126,3,.22);
    cursor: default;
  }
  .card.front .chosen{
    position:absolute; top:44px; left:0; right:0;
    font-size:11.5px; font-weight:600; color:var(--orange);
    letter-spacing:.04em;
    opacity:0; transform: translateY(-4px);
    transition: opacity .3s ease .1s, transform .3s ease .1s;
  }
  .card.front.locked .chosen{ opacity:1; transform:none; }

  /* ---------- Pull to refresh ---------- */
  #pull{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:center;
    height:56px;
    font-size:12.5px; color:var(--ink-soft);
    transform: translateY(-56px);
    z-index: 8;
    pointer-events:none;
  }
  #pull .spin{
    display:inline-block; margin-right:7px;
    transition: transform .2s;
  }
  #pull.ready .spin{ transform: rotate(180deg); }

  /* ---------- Confetti rain (restaurant celebration) ---------- */
  #graffiti{
    position:absolute; inset:0; pointer-events:none; z-index:20; overflow:hidden;
  }
  .confetti{
    position:absolute;
    top:-30px;
    will-change: transform, opacity;
    animation-name: cf-fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  /* falls straight down, then vanishes around 70% of the screen */
  @keyframes cf-fall{
    0%   { transform: translateY(0);            opacity: 1; }
    78%  { opacity: 1; }
    100% { transform: translateY(var(--drop));  opacity: 0; }
  }
  /* the paper itself: spins and flutters at its own pace */
  .confetti i{
    display:block;
    width: var(--w);
    height: var(--h);
    background: var(--c);
    border-radius: var(--br);
    will-change: transform;
    animation-name: cf-flutter;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes cf-flutter{
    0%   { transform: translateX(0)          rotate(0deg)   rotateY(0deg); }
    25%  { transform: translateX(var(--sway)) rotate(90deg)  rotateY(180deg); }
    50%  { transform: translateX(0)          rotate(180deg) rotateY(360deg); }
    75%  { transform: translateX(calc(var(--sway) * -1)) rotate(270deg) rotateY(180deg); }
    100% { transform: translateX(0)          rotate(360deg) rotateY(0deg); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div id="root">

  <div id="splash"><h1>Aaje su banavu?</h1></div>

  <div id="pull"><span class="spin">↓</span><span id="pullText">Pull down to change</span></div>

  <div id="home">
    <p class="meal-line" id="mealLine">Lunch</p>
    <h2 class="head" id="headline">Aaje su banavu?</h2>

    <div class="deck" id="deck">
      <div class="card back" id="back2"></div>
      <div class="card back" id="back1"></div>
      <div class="card front" id="frontCard">
        <span class="kind" id="cardKind"></span>
        <span class="chosen">AAJE AA J</span>
        <p class="dish" id="dishName">—</p>
        <p class="sub" id="dishSub"></p>
      </div>
    </div>

    <p class="hint" id="hint">Swipe the card for something else</p>
    <button class="confirm-btn" id="confirmBtn">Ha, aaje aa banavu</button>
  </div>

  <div id="graffiti"></div>
</div>

<script>
/* =========================================================
   1. DISH DATA
   ========================================================= */

/* Everyday Gujarati shaak — the backbone of the app */
const GUJARATI = [
  { name: "Dudhi nu shaak",          sub: "Bottle gourd, gram flour · rotli, dal" },
  { name: "Bhinda nu shaak",         sub: "Okra, onion, dhana jeeru · rotli" },

  { name: "Chola nu shaak",          sub: "Black eyed peas, tomato · rotli, bhaat" },
  { name: "Chana nu shaak",          sub: "Kathol, thick masala · rotla, dungri" },

  { name: "Sev nu shaak",            sub: "Quick sev gravy · rotli, when nothing's in the fridge" },

  { name: "Panchkutiyu shaak",       sub: "Five winter vegetables · bajra rotla" },
  { name: "Sukhi bhaji",             sub: "Dry potato bhaji, rai hing · rotli, chaas" },
  { name: "Bharela ringan",          sub: "Stuffed eggplant, peanut masala · rotla" },
  { name: "Kadhi ne bhajiya",        sub: "Chaas kadhi with methi bhajiya · bhaat" },
  { name: "Tuvar dal ne bhaat",      sub: "Toor dal, gol, kokum · rotli" },
  { name: "Mag ni dal",              sub: "Moong dal, ghee, jeera tadka · rotli" },
];

/* Rotla-forward plates — the ones that only taste right with bajra rotla */
const ROTLA_PLATE = [
  { name: "Bajra rotla ne ringan no olo", sub: "With gol, ghee and raw onion" },
  { name: "Bajra rotla ne lasaniya bateta", sub: "Garlic potatoes, chaas on the side" },
  { name: "Bajra rotla ne sev tameta",   sub: "Classic winter plate" },
  { name: "Bajra rotla, gol ne ghee",    sub: "Simplest dinner there is · chaas" },
  { name: "Jowar rotla ne dahi",         sub: "With green chutney and dungri" },
  { name: "Bajra rotla ne kathol",       sub: "Chana or chola, thick masala" },
];

/* Lightweight — for tired days and late dinners */
const LIGHT = [
  { name: "Kadhi khichdi",       sub: "Light · rice, moong dal, chaas kadhi" },
  { name: "Vaghareli khichdi",   sub: "Light · leftover rice, rai, mari" },
  { name: "Mag ni dal khichdi",  sub: "Light · ghee, papad, chundo" },
  { name: "Methi thepla ne dahi",sub: "Light · thepla, curd, chundo" },
  { name: "Dal dhokli",          sub: "Light · one pot, nothing else needed" },
  { name: "Khaman",              sub: "Light · besan, chutney, chaas" },
  { name: "Dhokla ne chutney",   sub: "Light · steamed, sesame tadka" },
  { name: "Handvo",              sub: "Light · bottle gourd, curd batter" },
  { name: "Muthiya ne chaas",    sub: "Light · steamed dudhi muthiya" },
  { name: "Bhakhri ne chaas",    sub: "Light · with achar and gol" },
  { name: "Rotli ne doodh",      sub: "Light · when nobody's hungry" },
];

/* Rice plates */
const RICE = [
  { name: "Dal bhaat",           sub: "Rice · tuvar dal, ghee, papad" },
  { name: "Masala bhaat",        sub: "Rice · vegetables, goda masala" },
  { name: "Vaghareli khichdi",   sub: "Rice · rai, mari, dahi" },
  { name: "Kadhi bhaat",         sub: "Rice · sweet chaas kadhi" },
  { name: "Veg pulao ne raita",  sub: "Rice · peas, carrot, curd" },
  { name: "Dahi bhaat",          sub: "Rice · curd, rai tadka, achar" },
  { name: "Khichdi ne kadhi",    sub: "Rice · moong dal, ghee" },
  { name: "Jeera bhaat ne dal fry", sub: "Rice · cumin rice, tadka dal" },
];

/* Sweets — only now and then */
const SWEET = [
  { name: "Sukhdi",         sub: "Sweet day · wheat flour, gol, ghee" },
  { name: "Lapsi",          sub: "Sweet day · cracked wheat, gol" },
  { name: "Sheero",         sub: "Sweet day · sooji, ghee, elchi" },
  { name: "Basundi ne puri",sub: "Sweet day · thickened milk" },
  { name: "Shrikhand puri", sub: "Sweet day · kesar shrikhand" },
  { name: "Doodh pak",      sub: "Sweet day · rice kheer, dry fruit" },
  { name: "Mohanthal",      sub: "Sweet day · besan, ghee, kesar" },
  { name: "Churma ladu",    sub: "Sweet day · gol, ghee, ghau no lot" },
];

/* Something different — other regions */
const REGIONAL = [
  { name: "Masala dosa",          sub: "South Indian · potato bhaji, chutney" },
  { name: "Idli sambhar",         sub: "South Indian · steamed, coconut chutney" },
  { name: "Uttapam",              sub: "South Indian · onion, tomato, sambhar" },
  { name: "Lemon rice",           sub: "South Indian · curry leaf, peanuts" },
  { name: "Rajma chawal",         sub: "Punjabi · kidney beans, rice" },
  { name: "Chole bhature",        sub: "Punjabi · chana, fried bhature" },
  { name: "Paneer butter masala", sub: "Punjabi · paneer, tomato gravy" },
  { name: "Dal makhani ne roti",  sub: "Punjabi · black dal, butter" },
  { name: "Aloo paratha",         sub: "Punjabi · curd, butter, achar" },
  { name: "Pav bhaji",            sub: "Mumbai · mixed veg, butter pav" },
  { name: "Misal pav",            sub: "Maharashtrian · sprouts, tarri" },
  { name: "Veg biryani",          sub: "Hyderabadi · basmati, raita" },
  { name: "Poha",                 sub: "Indori · sev, lemon, kanda" },
];

/* Restaurant days */
const RESTAURANT = [
  { name: "Aaje bahar jamie!",  sub: "Take a break — no cooking today" },
  { name: "Restaurant day",     sub: "Kitchen off duty. Go eat out." },
  { name: "Bahar khaie?",       sub: "Skip the stove, pick a favourite place" },
  { name: "Aaje raso band!",    sub: "Order in or step out — your call" },
];

/* Chance settings — tweak these freely (must add up under 1) */
const CHANCE = {
  restaurant: 0.05,   // ~1 in 20
  sweet:      0.05,   // sweets only now and then
  regional:   0.14,   // South Indian, Punjabi and friends
  light:      0.16,   // tired-day food
  rice:       0.14,   // rice plates
  rotla:      0.12,   // rotla-forward plates
  // everything left over goes to everyday Gujarati shaak (~34%)
};

const MAX_PER_WEEK   = 2;   // same dish at most twice in 7 days
const NO_REPEAT_LAST = 10;  // and never repeat within the last 10 suggestions

/* =========================================================
   2. STORAGE (safe — falls back to memory if blocked)
   ========================================================= */
const memStore = {};
const store = {
  get(k){
    try { const v = localStorage.getItem(k); return v === null ? memStore[k] : v; }
    catch(e){ return memStore[k]; }
  },
  set(k, v){
    memStore[k] = v;
    try { localStorage.setItem(k, v); } catch(e){}
  }
};

/* --- What was actually COOKED (drives the 7-day rule) --- */
function loadHistory(){
  try { return JSON.parse(store.get("cookedHistory") || "[]"); }
  catch(e){ return []; }
}
function saveHistory(h){ store.set("cookedHistory", JSON.stringify(h)); }

function recordCooked(name){
  const h = loadHistory();
  h.push({ name: name, at: Date.now() });
  const weekAgo = Date.now() - 7*24*60*60*1000;
  saveHistory(h.filter(x => x.at > weekAgo));
}

function countThisWeek(name){
  const weekAgo = Date.now() - 7*24*60*60*1000;
  return loadHistory().filter(x => x.name === name && x.at > weekAgo).length;
}

/* --- What was merely SEEN while swiping (short memory only) --- */
function loadSeen(){
  try { return JSON.parse(store.get("seenQueue") || "[]"); }
  catch(e){ return []; }
}
function recordSeen(name){
  const q = loadSeen();
  q.push(name);
  store.set("seenQueue", JSON.stringify(q.slice(-NO_REPEAT_LAST)));
}

/* --- Today's locked-in choice --- */
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}
function loadLock(){
  try { return JSON.parse(store.get("mealLock") || "null"); }
  catch(e){ return null; }
}
function saveLock(dish, mealKey){
  store.set("mealLock", JSON.stringify({ day: todayKey(), meal: mealKey, dish: dish }));
}
function clearLock(){ store.set("mealLock", "null"); }

/* =========================================================
   3. MEAL TIME DETECTION
   ========================================================= */
function currentMeal(){
  const h = new Date().getHours();
  if (h >= 4 && h < 11)  return { key:"breakfast", label:"Breakfast" };
  if (h >= 11 && h < 16) return { key:"lunch",     label:"Lunch" };
  return { key:"dinner", label:"Dinner" };
}

/* =========================================================
   4. PICKING A DISH
   ========================================================= */

/* The last few names shown, so nothing comes back too soon */
function recentNames(){
  return loadSeen();
}

function choosePool(meal){
  const r = Math.random();
  let acc = 0;

  // Mornings lean heavily on light food, never on a full shaak thali
  if (meal === "breakfast"){
    if (r < 0.06) return { pool: SWEET,     kind: "sweet" };
    if (r < 0.20) return { pool: REGIONAL,  kind: "regional" };
    return { pool: LIGHT, kind: "light" };
  }

  acc += CHANCE.restaurant; if (r < acc) return { pool: RESTAURANT,   kind: "restaurant" };
  acc += CHANCE.sweet;      if (r < acc) return { pool: SWEET,        kind: "sweet" };
  acc += CHANCE.regional;   if (r < acc) return { pool: REGIONAL,     kind: "regional" };
  acc += CHANCE.light;      if (r < acc) return { pool: LIGHT,        kind: "light" };
  acc += CHANCE.rice;       if (r < acc) return { pool: RICE,         kind: "rice" };
  acc += CHANCE.rotla;      if (r < acc) return { pool: ROTLA_PLATE,  kind: "rotla" };

  return { pool: GUJARATI, kind: "regular" };
}

function pickDish(){
  const meal = currentMeal().key;
  const { pool, kind } = choosePool(meal);

  if (kind === "restaurant"){
    const r = RESTAURANT[Math.floor(Math.random() * RESTAURANT.length)];
    return { ...r, kind: "restaurant" };
  }

  const recent = recentNames();

  // Rule 1: nothing from the last few suggestions. Rule 2: max twice in 7 days.
  let allowed = pool.filter(d =>
    !recent.includes(d.name) && countThisWeek(d.name) < MAX_PER_WEEK
  );

  // Relax gently rather than getting stuck
  if (allowed.length === 0) allowed = pool.filter(d => !recent.includes(d.name));
  if (allowed.length === 0) allowed = pool;

  const d = allowed[Math.floor(Math.random() * allowed.length)];
  return { ...d, kind: kind };
}

/* =========================================================
   5. RENDERING
   ========================================================= */
const el = {
  splash:   document.getElementById("splash"),
  mealLine: document.getElementById("mealLine"),
  front:    document.getElementById("frontCard"),
  dishName: document.getElementById("dishName"),
  dishSub:  document.getElementById("dishSub"),
  cardKind: document.getElementById("cardKind"),
  back1:    document.getElementById("back1"),
  back2:    document.getElementById("back2"),
  graffiti: document.getElementById("graffiti"),
  confirm:  document.getElementById("confirmBtn"),
  hint:     document.getElementById("hint"),
  pull:     document.getElementById("pull"),
  pullText: document.getElementById("pullText"),
  home:     document.getElementById("home"),
};

const KIND_LABEL = {
  regular:    "Ghar nu jaman",
  rotla:      "Rotla nu jaman",
  light:      "Halvu jaman",
  rice:       "Bhaat nu jaman",
  sweet:      "Godhu jaman",
  regional:   "Something different",
  restaurant: "Aaje raja!"
};

let current = null;
let locked  = false;

function showDish(dish){
  current = dish;
  el.dishName.textContent = dish.name;
  el.dishSub.textContent  = dish.sub;
  el.cardKind.textContent = KIND_LABEL[dish.kind];
  el.front.classList.toggle("resto", dish.kind === "restaurant");

  // merely seeing a dish only stops it reappearing immediately —
  // it does NOT count as having cooked it
  if (dish.kind !== "restaurant") recordSeen(dish.name);
  if (dish.kind === "restaurant") dropGraffiti();
}

/* ---------- Lock in today's choice ---------- */
function lockIn(dish, silent){
  locked = true;
  el.front.classList.add("locked");
  el.confirm.disabled = true;
  el.confirm.textContent = dish.kind === "restaurant" ? "Bahar jaie chie" : "Nakki thai gayu";
  el.hint.textContent = "Pull down to change";
  if (!silent){
    recordCooked(dish.name);
    saveLock(dish, currentMeal().key);
  }
}

function unlock(){
  locked = false;
  el.front.classList.remove("locked");
  el.confirm.disabled = false;
  el.confirm.textContent = "Ha, aaje aa banavu";
  el.hint.textContent = "Swipe the card for something else";
  clearLock();
}

let animating = false;

function nextDish(direction){
  if (animating) return;
  animating = true;

  const dir  = direction || 1;
  const dist = dir * 460;

  // 1. Top card is thrown off, and the deck below rises to fill the gap
  el.front.style.transition = "transform .30s cubic-bezier(.4,0,.9,.4), opacity .30s ease";
  el.front.style.transform  = "translate(" + dist + "px," + (-30) + "px) rotate(" + (dir*16) + "deg) scale(.98)";
  el.front.style.opacity    = "0";
  setBackProgress(1, true);

  setTimeout(() => {
    // 2. New card is drawn from underneath the stack
    showDish(pickDish());
    el.front.style.transition = "none";
    el.front.style.transform  = tf(SLOT.deep);
    el.front.style.opacity    = "0";

    requestAnimationFrame(() => {
      // 3. It settles on top while the deck relaxes back to rest
      el.front.style.transition = "transform .38s cubic-bezier(.2,.85,.3,1), opacity .26s ease";
      el.front.style.transform  = tf(SLOT.front);
      el.front.style.opacity    = "1";
      setBackProgress(0, true);
      setTimeout(() => { animating = false; }, 380);
    });
  }, 300);
}

/* ---------- Deck slots: the stack shifts as a real deck ---------- */
const SLOT = {
  front:    { x:   0, y:   0, rot:  0,   s: 1    },
  behind1:  { x:  14, y: -10, rot:  7,   s: 0.97 },
  behind2:  { x: -16, y:  12, rot: -8,   s: 0.94 },
  deep:     { x:  -6, y:  20, rot: -3,   s: 0.90 },
};

function tf(slot){
  return "translate(" + slot.x + "px," + slot.y + "px) rotate(" + slot.rot + "deg) scale(" + slot.s + ")";
}
function lerpSlot(a, b, t){
  return {
    x:   a.x   + (b.x   - a.x)   * t,
    y:   a.y   + (b.y   - a.y)   * t,
    rot: a.rot + (b.rot - a.rot) * t,
    s:   a.s   + (b.s   - a.s)   * t,
  };
}

/* How far the back cards creep forward while you drag (0 = none, 1 = full step) */
function setBackProgress(t, animate){
  const ease = animate ? "transform .32s cubic-bezier(.2,.8,.3,1)" : "none";
  el.back1.style.transition = ease;
  el.back2.style.transition = ease;
  el.back1.style.transform = tf(lerpSlot(SLOT.behind1, SLOT.front,   t * 0.85));
  el.back2.style.transform = tf(lerpSlot(SLOT.behind2, SLOT.behind1, t));
}

setBackProgress(0, false);

/* =========================================================
   6. SWIPE / DRAG
   ========================================================= */
let dragging = false, startX = 0, dx = 0;

const THROW_AT = 80; // px before the card actually leaves

el.front.addEventListener("pointerdown", e => {
  if (animating || locked) return;
  dragging = true; startX = e.clientX; dx = 0;
  el.front.style.transition = "none";
  el.front.setPointerCapture(e.pointerId);
});

el.front.addEventListener("pointermove", e => {
  if (!dragging) return;
  dx = e.clientX - startX;
  const lift = -Math.min(18, Math.abs(dx) * 0.12);
  el.front.style.transform = "translate(" + dx + "px," + lift + "px) rotate(" + (dx * 0.055) + "deg)";
  el.front.style.opacity = String(Math.max(.4, 1 - Math.abs(dx) / 420));

  // the deck underneath creeps forward as the top card pulls away
  setBackProgress(Math.min(1, Math.abs(dx) / (THROW_AT * 2)), false);
});

function releaseDrag(){
  if (!dragging) return;
  dragging = false;
  if (Math.abs(dx) > THROW_AT){
    nextDish(dx > 0 ? 1 : -1);
  } else {
    el.front.style.transition = "transform .3s cubic-bezier(.2,.85,.3,1), opacity .25s";
    el.front.style.transform  = tf(SLOT.front);
    el.front.style.opacity    = "1";
    setBackProgress(0, true); // deck settles back down with it
  }
}
el.front.addEventListener("pointerup", releaseDrag);
el.front.addEventListener("pointercancel", releaseDrag);

/* Keyboard access */
el.front.tabIndex = 0;
el.front.addEventListener("keydown", e => {
  if (locked) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") nextDish(1);
  if (e.key === "ArrowLeft") nextDish(-1);
});

/* =========================================================
   7. CONFETTI RAIN (restaurant days)
   ========================================================= */
const CONFETTI_COLORS = [
  "#F0326E", // pink
  "#1B7EF5", // blue
  "#3DBB4E", // green
  "#FFC016", // yellow
  "#9046C4", // purple
  "#FB4A3E", // red
];

/* Paper scraps aren't uniform — a few different cuts */
const CONFETTI_SHAPES = [
  { w: 9,  h: 14, br: "2px 6px 2px 6px" },
  { w: 12, h: 8,  br: "6px 2px 6px 2px" },
  { w: 7,  h: 12, br: "3px" },
  { w: 11, h: 11, br: "50% 6px 50% 6px" },
  { w: 8,  h: 16, br: "2px" },
];

function dropGraffiti(){
  const stage = el.graffiti;
  const height = stage.clientHeight || window.innerHeight;
  const PIECES = 70;

  for (let i = 0; i < PIECES; i++){
    const piece = document.createElement("span");
    piece.className = "confetti";

    const shape = CONFETTI_SHAPES[Math.floor(Math.random() * CONFETTI_SHAPES.length)];
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];

    // every scrap falls at its own speed, so nothing moves as a block
    const fallTime  = 1.5 + Math.random() * 2.4;          // 1.5s – 3.9s
    const stagger   = Math.random() * 1.3;                // rain, not a single dump
    const stopAt    = height * (0.62 + Math.random()*0.1); // vanish around 70% down
    const spinTime  = 0.5 + Math.random() * 1.1;

    piece.style.left = (Math.random() * 100) + "%";
    piece.style.setProperty("--drop", stopAt + "px");
    piece.style.animationDuration = fallTime + "s";
    piece.style.animationDelay = stagger + "s";

    const paper = document.createElement("i");
    paper.style.setProperty("--w",  shape.w + "px");
    paper.style.setProperty("--h",  shape.h + "px");
    paper.style.setProperty("--br", shape.br);
    paper.style.setProperty("--c",  color);
    paper.style.setProperty("--sway", (6 + Math.random() * 16) + "px");
    paper.style.animationDuration = spinTime + "s";
    paper.style.animationDelay = (Math.random() * 0.4) + "s";

    piece.appendChild(paper);
    stage.appendChild(piece);
    setTimeout(() => piece.remove(), (fallTime + stagger) * 1000 + 200);
  }
}

/* =========================================================
   8. CONFIRM + PULL TO REFRESH
   ========================================================= */
el.confirm.addEventListener("click", () => {
  if (locked || !current) return;
  lockIn(current);
});

/* --- Pull down anywhere on the screen to start over --- */
const PULL_TRIGGER = 74;
let pulling = false, pullStartY = 0, pullDy = 0;

function setPull(dy){
  const eased = Math.min(dy * 0.55, 86);
  el.pull.style.transform = "translateY(" + (eased - 56) + "px)";
  el.pull.classList.toggle("ready", dy > PULL_TRIGGER);
  el.pullText.textContent = dy > PULL_TRIGGER ? "Release for a new one" : "Pull down to change";
  el.home.style.transform = "translateY(" + (eased * 0.35) + "px)";
}

function resetPull(animate){
  el.pull.style.transition = animate ? "transform .3s cubic-bezier(.2,.8,.3,1)" : "none";
  el.home.style.transition = animate ? "transform .3s cubic-bezier(.2,.8,.3,1)" : "none";
  el.pull.style.transform = "translateY(-56px)";
  el.home.style.transform = "translateY(0)";
  el.pull.classList.remove("ready");
}

document.getElementById("root").addEventListener("pointerdown", e => {
  if (dragging || animating) return;
  pulling = true; pullStartY = e.clientY; pullDy = 0;
  el.pull.style.transition = "none";
  el.home.style.transition = "none";
});

document.getElementById("root").addEventListener("pointermove", e => {
  if (!pulling || dragging) return;
  pullDy = e.clientY - pullStartY;
  if (pullDy > 0) setPull(pullDy);
});

function endPull(){
  if (!pulling) return;
  pulling = false;
  if (pullDy > PULL_TRIGGER){
    unlock();
    showDish(pickDish());
    el.front.style.transition = "none";
    el.front.style.transform = tf(SLOT.deep);
    el.front.style.opacity = "0";
    requestAnimationFrame(() => {
      el.front.style.transition = "transform .4s cubic-bezier(.2,.85,.3,1), opacity .3s";
      el.front.style.transform = tf(SLOT.front);
      el.front.style.opacity = "1";
    });
  }
  resetPull(true);
}
document.getElementById("root").addEventListener("pointerup", endPull);
document.getElementById("root").addEventListener("pointercancel", endPull);

/* =========================================================
   9. BOOT
   ========================================================= */
const meal = currentMeal();
el.mealLine.textContent = meal.label;

const saved = loadLock();
if (saved && saved.day === todayKey() && saved.meal === meal.key){
  // already decided this meal — show the same answer, not a new one
  showDish(saved.dish);
  lockIn(saved.dish, true);
} else {
  if (saved) clearLock();   // new day or new meal — start fresh
  showDish(pickDish());
}

setTimeout(() => el.splash.classList.add("hide"), 1600);

/* offline support */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
